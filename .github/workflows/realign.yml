# Re-aligns class transcripts to chapter lines after chapter text changes
# (section-tool cloud editor saves, offline-editor pushes, hand edits) and
# commits the changed data/alignments/ files back to master, so the data
# build never sees an alignment pointing at a line that was split, merged or
# deleted. `yarn align` is offline and deterministic: with nothing stale it
# changes nothing and no commit is made.
#
# The Cloudflare Pages build of the triggering commit may still fail on a
# stale alignment; the commit this job pushes is then the one that deploys.
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
name: Re-align transcripts

on:
  push:
    branches: [master]
    paths:
      - data/chapters/**
      - data/alignment-chapters.json
      - data/tools/src/align.ts
      - data/tools/src/cli/align.ts
  workflow_dispatch:

permissions:
  contents: write

# Rapid editor saves collapse into one run on the latest master.
concurrency:
  group: realign
  cancel-in-progress: true

jobs:
  realign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # data/tools runs the Yarn release pinned in site/.yarn/releases (yarnPath).
      - name: Install data tools
        working-directory: data/tools
        run: |
          corepack enable
          yarn install --immutable

      - name: Align
        working-directory: data/tools
        run: yarn align

      - name: Commit changed alignments
        run: |
          if [ -z "$(git status --porcelain -- data/alignments)" ]; then
            echo "Alignments are up to date."
            exit 0
          fi
          git status --short -- data/alignments
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alignments
          git commit -q -m "data: re-align transcripts after chapter edits" \
            -m "Generated by the realign workflow (yarn align) for ${GITHUB_SHA}."
          for attempt in 1 2 3 4; do
            git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin master
          done
          echo "Could not push the re-aligned files." >&2
          exit 1

      # Fails the job (and notifies) when the data is still invalid, e.g. a
      # class start in data/chapter-starts.json now later than its first line.
      - name: Validate data
        working-directory: data/tools
        run: yarn build-data
