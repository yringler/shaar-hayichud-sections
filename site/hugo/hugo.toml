baseURL = "https://www.shaarhayichudresources.com"
title = "Shaar Hayichud"

[params]
  description = "Sections and study material from Shaar Hayichud"

[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      Access-Control-Allow-Origin = "*"

[markup.goldmark.renderer]
  unsafe = true

[outputFormats.ChapterIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

# Chapter JSON lives in the monorepo's data/chapters/ (single source of truth).
# Mount it as both data (for templates) and static (legacy raw JSON at /texts/).
[[module.mounts]]
  source = "../../data/chapters"
  target = "data/chapters"

[[module.mounts]]
  source = "../../data/chapters"
  target = "static/texts"

# Generated by the data build (data/tools, run by `yarn build`):
# publish data/dist/v1/ at /data/v1/ and expose the catalog as site.Data.v1.catalog.
[[module.mounts]]
  source = "../../data/dist/v1"
  target = "static/data/v1"

# Mount the single file (not the directory + a file filter): includeFiles was
# removed in Hugo 0.153 and its replacement does not exist before then, so a
# file mount is the only form that builds on every Hugo version.
[[module.mounts]]
  source = "../../data/dist/v1/catalog.json"
  target = "data/v1/catalog.json"

# The same generated files as assets, so templates can read the audio
# alignments and transcripts (resources.Get "data/v1/..." | transform.Unmarshal).
# Assets are only published when a template asks for their URL.
[[module.mounts]]
  source = "../../data/dist/v1"
  target = "assets/data/v1"

# Keep default mounts for other dirs
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "data"
  target = "data"

